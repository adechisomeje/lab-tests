[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-tests"
version = "0.1.0"
description = "Medical laboratory test catalogue with specimen requirements, turnaround times, reference intervals and clinic categorisation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["laboratory", "pathology", "healthcare", "emr", "reference-ranges", "phlebotomy"]
dependencies = []

[project.urls]
Homepage = "https://github.com/adechisomeje/lab-tests"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_tests"]
artifacts = ["src/lab_tests/data/*.json"]
